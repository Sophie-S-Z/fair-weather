name: CI
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # remove the flag when tests/property lands (M0.8)
      - run: npm run test:prop -- --passWithNoTests
      - name: Validate content
        if: hashFiles('tools/content-validate/validate.ts') != ''
        run: npm run validate-content
      - run: npm run build
