name: CI
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build (production; the placeholder guard fails it on any placeholder)
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # Offline play over the production build above.
      - name: Offline after the first load
        run: npm run test:offline
      - name: E2E (Chromium)
        run: npm run test:e2e
      # Each failed test's page snapshot (error-context.md), to find the cause of a failure.
      - name: Keep the failed tests' results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
